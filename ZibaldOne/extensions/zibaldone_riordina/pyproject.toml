[project]
name = "zibaldone-riordina"
version = "0.1.0"
description = "ZibaldOne: lista da riordinare che scorre da sola nella fascia alta e bassa (estensione Flet)"
requires-python = ">=3.10"
dependencies = ["flet>=1.0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.dart", "pubspec.yaml"]
